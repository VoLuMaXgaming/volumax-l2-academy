003e({'&':'&amp;','\\u003c':'&lt;','\\u003e':'&gt;','\\\"':'&quot;',\\\"'\\\":'&#39;'}[c]));\\nfunction lvBounds(){const v=Math.max(1,Math.min(80,Number(lvEl('lvCharacter').value)||28));\\n if(!lvEl('lvOverride').checked){lvEl('lvMin').value=Math.max(1,v-5);lvEl('lvMax').value=Math.min(85,v+2)}\\n return {char:v,lo:lvEl('lvOverride').checked?Math.max(1,Number(lvEl('lvMin').value)||1):Math.max(1,v-5),hi:lvEl('lvOverride').checked?Math.min(85,Number(lvEl('lvMax').value)||85):Math.min(85,v+2)}};\\nfunction lvMessage(text){lvEl('lvState').textContent=text}\\nlvEl('lvCharacter').addEventListener('input',lvBounds);\\nlvEl('lvOverride').addEventListener('change',()=\\u003e{const b=lvEl('lvOverride').checked;lvEl('lvMin').disabled=!b;lvEl('lvMax').disabled=!b;lvBounds()});\\nlvEl('lvGoals').addEventListener('click',e=\\u003e{let b=e.target.closest('[data-goal]');if(!b)return;lvGoal=b.dataset.goal;lvEl('lvGoals').querySelectorAll('button').forEach(t=\\u003et.classList.toggle('chosen',t===b))});\\nlvBounds();\\nfunction lvScore(m,level,cls,party,goal,adena){const gap=Math.abs(m.level-level),xp=Math.max(0,Number(m.server_xp||0)),hp=Math.max(1,Number(m.hp||1));\\n let score=goal==='xp'?Math.min(70,(xp/hp)*3):goal==='spoil'?Math.min(24,Number(m.spoil_count||0)*4):(adena==null?0:Math.min(55,adena/30));\\n score+=Math.max(0,9-gap*1.8);\\n if(cls==='spoiler'&&Number(m.spoil_count||0)\\u003e0)score+=6;\\n if(['mage','archer','healer','support'].includes(cls)&&m.aggressive===true)score-=party==='solo'?5:1;\\n if(cls==='tank'&&m.aggressive===true)score+=2;\\n if(party==='party'&&m.aggressive===true)score+=2;\\n return score;\\n}\\nasync function lvAdena(ids){const values=new Map();for(let k=0;k\\u003cids.length;k+=70){let idlist=ids.slice(k,k+70);const endpoint=API+'item_farming_sources?select=monster_id,loot_type,server_min_amount,server_max_amount,chance_percent&loot_type=eq.adena&monster_id=in.('+idlist.join(',')+')&limit=1000';\\n let response=await fetch(endpoint,{headers:{apikey esults').innerHTML=lvRecommendations.map((g,i)=\\u003e'\\u003cdiv class=\\\"lvzone\\\"\\u003e\\u003cb\\u003e'+(i+1)+'. 📍 '+lvEscape(g.zone)+'\\u003c/b\\u003e\\u003csmall\\u003e'+lvEscape(g.region)+' · '+g.mobs.length+' matched monster types'+(lvGoal==='adena'?' · Adena reference ranking':'')+'\\u003c/small\\u003e\\u003cbutton type=\\\"button\\\" data-lv-zone=\\\"'+i+'\\\"\\u003e🗺️ Show on Map\\u003c/button\\u003e \\u003ca href=\\\"./index.html?monster_id='+encodeURIComponent(g.mobs[0].id)+'#monster-'+encodeURIComponent(g.mobs[0].id)+'\\\" style=\\\"font-size:12px;color:#f1d08c\\\"\\u003eExample mob Wiki ↗\\u003c/a\\u003e\\u003c/div\\u003e').join('');\\n }catch(err){lvMessage('⚠️ '+err.message+' — try again');}finally{lvEl('lvFind').disabled=false}}\\nlvEl('lvFind').addEventListener('click',lvFind);\\nlvEl('lvResults').addEventListener('click',async e=\\u003e{const btn=e.target.closest('[data-lv-zone]');if(!btn)return;const z=lvRecommendations[Number(btn.dataset.lvZone)];if(!z)return;\\n btn.disabled=true;lvMessage('⏳ Loading known spawn coordinates for '+z.zone+'…');\\n try{const idlist=[...new Set(z.mobs.map(m=\\u003eNumber(m.id)))];let spots=[];\\n for(let k=0;k\\u003cidlist.length;k+=40){const chunk=idlist.slice(k,k+40);const part=await page('interlude_npc_fixed_locations','npc_id,name,npc_type,x,y,z,zone_label','npc_id=in.('+chunk.join(',')+')&npc_type=in.(Monster,FeedableBeast,FriendlyMob)&order=npc_id.asc',700,5000);spots.push(...part)}\\n const ref=new Map(z.mobs.map(m=\\u003e[Number(m.id),m]));const matched=spots.filter(row=\\u003eref.has(Number(row.npc_id))).map(row=\\u003enormalize({...row,...ref.get(Number(row.npc_id)),npc_id:Number(row.npc_id),x:row.x,y:row.y,z:row.z},'monster')).filter(m=\\u003eNumber.isFinite(m.x)&&Number.isFinite(m.y));\\n if(!matched.length){lvMessage('ℹ️ '+z.zone+' has '+z.mobs.length+' known monster types, but no matching spawn coordinates in our map database. Wiki details remain available.');return}\\n ++request;mode='monster';document.querySelectorAll('[data-mode]').forEach(b=\\u003eb.classList.toggle('active',b.dataset.mode==='monster'));\\n items=matched;selected=null;render();showQuick();fit();\\n const px=matched.map(m=\\u003epixel(m.x,m.y)).filter(p=\\u003ep.x\\u003e=0&&p.x\\u003c=W&&p.y\\u003e=0&&p.y\\u003c=H);\\n if(px.length){const cx=px.reduce((a,p)=\\u003ea+p.x,0)/px.length,cy=px.reduce((a,p)=\\u003ea+p.y,0)/px.length;\\n scale=3;tx=$('world').clientWidth/2-cx/W*baseWidth*scale;ty=$('world').clientHeight/2-cy/H*baseHeight*scale;updateTransform();drawPins()}\\n lvMessage('✅ '+matched.length+' stored spawn locations shown for '+z.zone+'. Select a marker for mob details.');status('🟢 Leveling Mode: '+z.zone+' · '+matched.length+' stored spawn locations (Classic reference).');\\n $('world').scrollIntoView({block:'center',behavior:'smooth'});\\n }catch(err){lvMessage('⚠️ Unable to load coordinates: '+err.message)}finally{btn.disabled=false}});\\n\";\nif(!html.includes('\u003csection class=\"panel\"\u003e\u003ch2\u003e🎯 Find locations\u003c/h2\u003e'))throw Error('Leveling addon: map structure changed');\n  html=html.replace('\u003csection class=\"panel\"\u003e\u003ch2\u003e🎯 Find locations\u003c/h2\u003e',LEVEL_HTML+'\u003csection class=\"panel\"\u003e\u003ch2\u003e🎯 Find locations\u003c/h2\u003e');\n  html=html.replace('\u003c/head\u003e',LEVEL_CSS+'\u003c/head\u003e');\n  const tail='load();'+String.fromCharCode(10)+'\u003c/scr'+'ipt\u003e\u003c/body\u003e\u003c/html\u003e';\n  if(!html.includes(tail))throw Error('Leveling addon: startup changed');\n  html=html.replace(tail,'load();'+String.fromCharCode(10)+LEVEL_JS+String.fromCharCode(10)+'\u003c/scr'+'ipt\u003e\u003c/body\u003e\u003c/html\u003e');\n  document.open();document.write(html);document.close();");
