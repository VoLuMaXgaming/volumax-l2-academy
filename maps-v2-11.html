<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoLuMaX World Map v2.11 · Farm & Loot</title><style>body{background:#071424;color:#eec87c;font:16px system-ui}.boot{max-width:640px;margin:13vh auto;text-align:center;padding:22px}progress{width:100%;accent-color:#eec87c}</style></head><body><div id="boot" class="boot"><h2>🌍 VoLuMaX World Map v2.11</h2><p>Loading map, leveling and monster loot…</p><progress></progress><p id="notice">Starting...</p></div><script>
(async()=>{try{
const r=await fetch('./maps-v2-10.html',{cache:'no-cache'});if(!r.ok)throw Error('v2.10 engine HTTP '+r.status);
let s=await r.text();const needle='const LEVEL_JS=';
if(!s.includes(needle))throw Error('Leveling extension injection point was not found');
const addon="\n/* VoLuMaX 2.11: monster loot and unverified zone fallback. */\nconst lv211Cache=new Map(); let lv211Selected=0, lv211Zone=null;\nconst lv211Style=document.createElement('style');lv211Style.textContent=`\n#mapQuick{max-height:85%;overflow:auto}#mapQuick .loot-subhead{color:#f2d18e;font-weight:700;font-size:13px;margin:9px 0 5px}\n#mapQuick .loot-grid{display:flex;flex-wrap:wrap;gap:6px}#mapQuick .loot-item{display:flex;align-items:center;gap:5px;min-width:0;background:#213a50;border:1px solid #4d6982;border-radius:8px;padding:4px 7px;font-size:11px;max-width:100%;overflow-wrap:anywhere}\n#mapQuick .loot-item img{width:26px;height:26px;object-fit:contain;background:#334353;border-radius:4px}\n#mapQuick .loot-item strong{font-weight:500}#mapQuick .loot-item em{font-style:normal;color:#e3c484;white-space:nowrap}\n#mapQuick .loot-info{font-size:11px;color:#b8cde0;padding-top:5px}#mapQuick .loot-summary{display:flex;gap:10px;flex-wrap:wrap;color:#ebd2a2;font-size:12px;margin:6px 0}\n#lvZoneFallback{display:none;margin:12px 0;padding:12px;border:1px solid #d6ae6f;border-radius:12px;background:#152e45;color:#d6e3ec}\n#lvZoneFallback h3{color:#f0d08b;margin:2px 0 7px}#lvZoneFallback .zone-monsters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}\n#lvZoneFallback button{border:1px solid #5c7892;color:#e5d4b2;background:#193b57;border-radius:9px;padding:9px;text-align:left;cursor:pointer}\n#pins .zone-marker{pointer-events:all;cursor:pointer}\n`;document.head.appendChild(lv211Style);\nconst fallback=document.createElement('section');fallback.id='lvZoneFallback';\nfallback.innerHTML='<h3>📍 Approximate hunting zone</h3><p>Spawn coordinates not available. Only the area on the illustrated Classic map is indicated; this is NOT an exact mob location.</p><div class=\"zone-monsters\"></div>';\nconst mapParent=document.getElementById('world')?.closest('section.panel');\nif(mapParent)mapParent.after(fallback);\nfunction lv211Escape(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction lv211LootHtml(rows){const types=[['drop','📦 DROP'],['spoil','⛏️ SPOIL']];return types.map(([kind,title])=>{\nconst filtered=rows.filter(r=>r.loot_type===kind).sort((a,b)=>Number(b.chance_percent||0)-Number(a.chance_percent||0));\nreturn '<div class=\"loot-subhead\">'+title+' ('+filtered.length+')</div>'+(filtered.length?'<div class=\"loot-grid\">'+filtered.slice(0,12).map(r=>'<div class=\"loot-item\">'+(r.icon_url?'<img loading=\"lazy\" alt=\"\" src=\"'+lv211Escape(r.icon_url)+'\">':'📦')+'<strong>'+lv211Escape(r.item_name)+'</strong> <em>'+Number(r.chance_percent||0).toFixed(2)+'%</em></div>').join('')+'</div>':'<div class=\"loot-info\">No '+kind+' records in Classic database</div>')+(filtered.length>12?'<div class=\"loot-info\">+'+(filtered.length-12)+' more in Wiki</div>':'');}).join('');}\nasync function lv211Fetch(id){if(!lv211Cache.has(id)){let r=await fetch(url('item_farming_sources','item_name,loot_type,chance_percent,icon_url','monster_id=eq.'+id+'&loot_type=in.(drop,spoil)&order=chance_percent.desc&limit=120'),{headers:{apikey:KEY,Accept:'application/json'}});if(!r.ok)throw Error('Loot HTTP '+r.status);lv211Cache.set(id,await r.json());}return lv211Cache.get(id);}\nconst lv211BaseQuick=showQuick;\nshowQuick=function(){lv211BaseQuick();const x=selected;if(!x||!['monster','questmob'].includes(x.kind))return;\n const key=Number(x.id),ticket=++lv211Selected;\n const stats=document.getElementById('mapQuickStats');stats.innerHTML='<div class=\"loot-summary\">'+(x.level?'⚔️ LVL '+x.level+' · ':'')+(x.hp!=null?'❤️ HP '+nice(x.hp)+' · ':'')+(x.xp!=null?'✨ XP '+nice(x.xp):'')+'</div><div class=\"loot-info\">⏳ Loading DROP / SPOIL…</div>';\n lv211Fetch(key).then(rows=>{if(ticket!==lv211Selected||Number(selected?.id)!==key)return;stats.innerHTML='<div class=\"loot-summary\">'+(x.level?'⚔️ LVL '+x.level+' · ':'')+(x.hp!=null?'❤️ HP '+nice(x.hp)+' · ':'')+(x.xp!=null?'✨ XP '+nice(x.xp):'')+'</div>'+lv211LootHtml(rows)+'<div class=\"loot-info\">Classic reference rates. Full loot list in Wiki.</div>';}).catch(e=>{if(ticket===lv211Selected)stats.innerHTML='<div class=\"loot-info\">⚠️ '+lv211Escape(e.message)+' · full details remain available in Wiki</div>';});\n};\n// Selected Location panel is compact too (no raw XYZ for ordinary monsters).\nconst lv211BaseRender=render;\nrender=function(){lv211BaseRender();if(selected&&['monster','questmob'].includes(selected.kind)){\nlet x=selected;let d=document.getElementById('detail');d.innerHTML='<h3>'+lv211Escape(x.name)+'</h3><p>⚔️ LVL '+x.level+(x.zone?' · '+lv211Escape(x.zone):'')+'</p><p class=\"muted\">📦 DROP and ⛏️ SPOIL: see the card on the map.</p><p><a href=\"'+wikiLink(x)+'\">📖 Complete monster Wiki ↗</a></p>';}\n};\n// No exact spawn points in Orc Barracks reference: make a distinct approximation rather than inventing NPC coordinates.\nconst lv211BaseDraw=drawPins;\ndrawPins=function(){lv211BaseDraw();if(!lv211Zone)return;const p=document.getElementById('pins');if(!p)return;\nconst fx=W*0.085,fy=H*0.712;\np.insertAdjacentHTML('beforeend','<circle class=\"zone-marker\" data-zone-approx=\"1\" cx=\"'+fx+'\" cy=\"'+fy+'\" r=\"'+Math.max(2.5,10/Math.max(1,scale))+'\" fill=\"#f3c267\" stroke=\"#17354c\" stroke-width=\"3\"><title>Orc Barracks · approximate illustrated area, not a known spawn</title></circle>');};\nconst lv211BaseFocus=focus;\nfocus=function(row){lv211Zone=null;fallback.style.display='none';lv211BaseFocus(row);};\nconst lv211BaseLoad=load;\nload=async function(){lv211Zone=null;fallback.style.display='none';return lv211BaseLoad();};\nfunction lv211ShowOrc(z){lv211Zone=z;items=[];selected=null;render();showQuick();fit();\n// The source image labels the Orc Barracks in its lower-western area. Visual pointer only.\nscale=3.4;const fx=W*0.085,fy=H*0.712;tx=document.getElementById('world').clientWidth/2-fx/W*baseWidth*scale;ty=document.getElementById('world').clientHeight/2-fy/H*baseHeight*scale;updateTransform();drawPins();\nfallback.style.display='block';fallback.querySelector('h3').textContent='📍 Orc Barracks – '+z.mobs.length+' matching monster types';\nfallback.querySelector('.zone-monsters').innerHTML=z.mobs.map(m=>'<button type=\"button\" data-monster-loot=\"'+Number(m.id)+'\">⚔️ '+lv211Escape(m.name)+' · LVL '+Number(m.level)+'</button>').join('');\nlvMessage('ℹ️ Orc Barracks: no confirmed spawn points in the coordinate database. Showing its approximate map region and '+z.mobs.length+' monster types with Wiki loot details.');\ndocument.getElementById('world').scrollIntoView({behavior:'smooth',block:'center'});\n}\nfallback.addEventListener('click',e=>{let b=e.target.closest('[data-monster-loot]');if(!b)return;const id=Number(b.dataset.monsterLoot);const m=lv211Zone?.mobs.find(m=>Number(m.id)===id);if(!m)return;\nlet target=document.getElementById('lv211LootBox');if(!target){target=document.createElement('div');target.id='lv211LootBox';fallback.appendChild(target);}target.innerHTML='<h3>'+lv211Escape(m.name)+' · LVL '+m.level+'</h3><p>Loading DROP / SPOIL…</p>';\nlv211Fetch(id).then(rows=>{target.innerHTML='<h3>'+lv211Escape(m.name)+' · LVL '+m.level+'</h3>'+lv211LootHtml(rows)+'<p><a href=\"'+wikiLink({id})+'\">📖 Full Wiki Details ↗</a></p>';}).catch(e=>target.textContent='Unable to load loot: '+e.message);\ntarget.scrollIntoView({behavior:'smooth',block:'nearest'});\n});\n// Listen before older Show on Map handler; only intercept Orc Barracks, which has no stored coordinates.\nlvEl('lvResults').addEventListener('click',e=>{let b=e.target.closest('[data-lv-zone]');if(!b)return;const z=lvRecommendations[Number(b.dataset.lvZone)];if(!z||z.zone.toLowerCase()!=='orc barracks')return;e.preventDefault();e.stopImmediatePropagation();lv211ShowOrc(z);},true);\n// Keep -2/+2 on any level adjustment and when opening the panel.\nlvBounds=function(){let v=Math.max(1,Math.min(80,Number(lvEl('lvCharacter').value)||28));if(!lvEl('lvOverride').checked){lvEl('lvMin').value=Math.max(1,v-2);lvEl('lvMax').value=Math.min(85,v+2);}return {char:v,lo:lvEl('lvOverride').checked?Math.max(1,Number(lvEl('lvMin').value)||1):Math.max(1,v-2),hi:lvEl('lvOverride').checked?Math.min(85,Number(lvEl('lvMax').value)||85):Math.min(85,v+2)};};lvBounds();\nconst lv211Note=lvEl('lvAdvanced')?.querySelector('.lvnote');if(lv211Note)lv211Note.textContent='Default recommended mob LVL: character level −2 to +2. This is a conservative hunting recommendation, not a verified XP-penalty threshold. Custom min/max may be set above.';\n";
s=s.replace(needle,'const ADDON_JS='+JSON.stringify(addon)+';\n'+needle);
const a='+LEVEL_JS+String.fromCharCode(10)';if(!s.includes(a))throw Error('v2.10 map injection point changed');
s=s.replace(a,a+'+ADDON_JS+String.fromCharCode(10)');
s=s.replace('World Map v2.10 · Integrated Leveling','World Map v2.11 · Farm & Loot');
document.open();document.write(s);document.close();
}catch(e){document.getElementById('notice').textContent='⚠️ '+e.message;let a=document.createElement('a');a.href='./maps-v2-10.html';a.textContent='Open last working version';document.getElementById('boot').appendChild(a)}})();
</script></body></html>
